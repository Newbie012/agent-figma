name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      # corepack cannot install pnpm 12 yet, so install it the way pnpm documents.
      - run: npm install -g --allow-scripts=pnpm pnpm@12.0.0-rc.6
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check

  oldest-supported-node:
    # package.json says Node 22 is supported, so the bundle has to answer there.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm install -g --allow-scripts=pnpm pnpm@12.0.0-rc.6
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm smoke

  release-plan:
    # A change that ships needs an intent recorded with it, or the release
    # workflow finds nothing pending and main goes out unpublished.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install -g --allow-scripts=pnpm pnpm@12.0.0-rc.6
      - run: pnpm change status
